<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSOP ETP Product Line (Hong Kong)</title>
<style>
  :root{
    --navy:#0b1f3a; --navy2:#102a4c; --red:#e2231a; --gold:#f4b400;
    --ink:#11203a; --muted:#6b7a90; --line:#e4e9f2; --bg:#f3f6fb; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#eef3fb 0%,#f6f8fc 100%);
    color:var(--ink); min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    overflow-x:hidden; -webkit-text-size-adjust:100%;
  }
  /* ---------- layout ---------- */
  .wrap{max-width:880px; width:100%; margin:0 auto; flex:1;
        padding:clamp(16px,4vw,26px) clamp(12px,4vw,18px) clamp(24px,6vw,40px);
        display:flex; flex-direction:column; align-items:center;}
  .brand{display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:8px;}
  .brand-logo{height:clamp(40px,13vw,58px); max-width:86vw; object-fit:contain;
    width:auto; display:block; mix-blend-mode:multiply;}
  h1{font-size:clamp(20px,5.6vw,25px);margin:0;color:var(--navy);letter-spacing:.5px;text-align:center}
  h1 .nb{white-space:nowrap}
  .sub{color:var(--muted);font-size:clamp(13px,3.7vw,15px);margin:2px 0 18px;text-align:center}
  /* ---------- filters ---------- */
  .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:8px clamp(12px,3.6vw,16px);border-radius:999px;cursor:pointer;
    font-size:clamp(14px,3.8vw,15px);font-weight:600;transition:.15s}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip:hover{transform:translateY(-1px)}
  /* ---------- card ---------- */
  .card{
    width:100%; background:var(--card); border:1px solid var(--line);
    border-radius:clamp(14px,3vw,20px);
    box-shadow:0 18px 50px rgba(16,42,76,.12);
    padding:clamp(22px,7vw,42px) clamp(14px,5vw,30px); text-align:center;
    min-height:clamp(240px,58vw,300px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0;
    background:radial-gradient(900px 300px at 50% -10%,rgba(226,35,26,.08),transparent 60%);}
  .placeholder{color:var(--muted);font-size:clamp(16px,4.5vw,19px)}
  .ticker{font-size:clamp(44px,14vw,72px);font-weight:800;color:var(--red);line-height:1;letter-spacing:2px;
    position:relative;word-break:break-word}
  .ticker small{display:block;font-size:clamp(13px,3.6vw,16px);color:var(--muted);font-weight:600;
    letter-spacing:1px;margin-top:8px}
  .fund{font-size:clamp(19px,5.3vw,27px);font-weight:700;color:var(--navy);
    margin-top:clamp(12px,3.5vw,18px);line-height:1.35;position:relative}
  .tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:clamp(10px,3vw,16px)}
  .cat-tag{display:inline-block;font-size:clamp(12px,3.3vw,13px);font-weight:700;letter-spacing:1px;
    padding:5px clamp(9px,3vw,12px);border-radius:999px;background:#eef3fb;color:var(--navy)}
  .cat-tag.warn{background:#fff4e5;color:#a8630a}
  .reveal{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
  /* ---------- rolling (抽獎過程：滿屏 ticker 隨機顯示) ---------- */
  .card.rolling{border-color:var(--red);box-shadow:0 18px 60px rgba(226,35,26,.30)}
  #viewRolling{position:absolute;inset:0}
  .codefield{position:absolute;inset:0;display:grid;
    gap:clamp(4px,1.4vw,6px) clamp(5px,1.6vw,8px);
    padding:clamp(10px,3vw,18px) clamp(12px,4vw,22px);
    grid-template-columns:repeat(var(--cols,8),1fr);align-content:center;pointer-events:none}
  .cell{display:flex;align-items:center;justify-content:center;
    height:clamp(26px,7vw,34px);border-radius:7px;
    font-size:clamp(13px,3.6vw,18px);font-weight:700;letter-spacing:.5px;color:#c6d1e0;
    font-variant-numeric:tabular-nums;
    transition:color .07s linear,transform .09s ease-out;
    will-change:color,transform}
  .cell.lit{color:#fff;background:var(--red);transform:scale(1.16);
    box-shadow:0 8px 20px rgba(226,35,26,.35)}
  .rollhint{position:absolute;left:0;right:0;bottom:clamp(6px,2vw,12px);text-align:center;
    color:var(--red);font-weight:800;font-size:clamp(13px,3.7vw,15px);letter-spacing:1px}
  .btn-draw.rolling-btn{background:var(--navy);box-shadow:0 10px 24px rgba(11,31,58,.30)}
  /* ---------- controls ---------- */
  .controls{display:flex;gap:clamp(10px,3vw,14px);margin-top:clamp(18px,5vw,26px);
    flex-wrap:wrap;justify-content:center;width:100%}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:700;
    font-size:clamp(15px,4.1vw,18px);padding:clamp(13px,3.6vw,16px) clamp(18px,7vw,34px);
    transition:.15s}
  .controls button{flex:1 1 auto;min-width:118px;max-width:280px}
  .btn-draw{background:var(--red);color:#fff;box-shadow:0 10px 24px rgba(226,35,26,.32)}
  .btn-draw:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 30px rgba(226,35,26,.4)}
  .btn-draw:disabled{background:#c4ccd8;box-shadow:none;cursor:not-allowed}
  .btn-reset{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .btn-reset:hover{background:var(--navy);color:#fff}
  .stats{margin-top:clamp(16px,4.5vw,22px);color:var(--muted);
    font-size:clamp(14px,3.9vw,16px);font-weight:600;text-align:center}
  .stats b{color:var(--navy);font-size:clamp(17px,4.7vw,20px)}
  .done{color:var(--red);font-weight:700;margin-top:14px;font-size:clamp(15px,4vw,17px);display:none}
  footer{text-align:center;color:#9aa7b8;font-size:clamp(12px,3.3vw,13px);padding:14px;line-height:1.7}
  /* ---------- group selector (A / B) ---------- */
  .group-sel{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.4vw,10px);
    margin-top:clamp(16px,4.5vw,22px);flex-wrap:wrap}
  .group-sel__label{color:var(--muted);font-size:clamp(13px,3.6vw,14px);font-weight:600;margin-right:2px}
  .gbtn{border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:clamp(8px,2.2vw,10px) clamp(16px,5vw,22px);border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:clamp(14px,3.9vw,15px);font-weight:700;transition:.15s}
  .gbtn:hover{transform:translateY(-1px)}
  .gbtn.active{color:#fff;border-color:transparent}
  .gbtn.active[data-g="A"]{background:var(--navy)}
  .gbtn.active[data-g="B"]{background:#0e8a6e}
  .history__grp{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 9px;
    border-radius:999px;color:#fff}
  .history__grp.grp-A{background:var(--navy)}
  .history__grp.grp-B{background:#0e8a6e}
  .history__groups{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);
    background:#f1f5fb;border-radius:999px;padding:3px 10px}
  .history__groups b{color:var(--navy)}
  /* ---------- history (抽取記錄) ---------- */
  .history{width:100%;margin-top:clamp(16px,4.5vw,22px);background:var(--card);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(16,42,76,.07);
    padding:clamp(11px,3vw,14px) clamp(12px,3.5vw,16px) 8px;text-align:left}
  .history__head{display:flex;align-items:center;gap:10px;padding:0 2px 10px;border-bottom:1px solid var(--line)}
  .history__title{font-size:clamp(14px,4vw,16px);font-weight:800;color:var(--navy);letter-spacing:.5px}
  .history__count{font-size:13px;font-weight:700;color:#fff;background:var(--red);
    border-radius:999px;padding:2px 10px;line-height:1.55}
  .history__clear{margin-left:auto;background:#fff;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;font-size:13px;font-weight:700;padding:5px clamp(10px,3vw,14px)}
  .history__clear:hover{color:var(--navy);border-color:var(--navy)}
  .history__list{list-style:none;margin:0;padding:0;max-height:clamp(170px,45vh,266px);overflow-y:auto}
  .history__list li{display:flex;align-items:center;gap:10px;padding:9px 4px;
    border-bottom:1px dashed #eef2f8;font-size:clamp(13px,3.7vw,15px)}
  .history__list li:last-child{border-bottom:none}
  .history__no{flex:0 0 clamp(24px,7vw,32px);color:#9aa7b8;font-size:13px;font-weight:700;
    font-variant-numeric:tabular-nums}
  .history__code{flex:0 0 auto;font-weight:800;color:var(--red);
    font-size:clamp(15px,4.2vw,17px);letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .history__name{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;color:var(--ink);
    font-weight:600;line-height:1.35}
  .history__cat{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 9px;
    border-radius:999px;background:#eef3fb;color:var(--navy)}
  .history__del{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:clamp(26px,7.5vw,30px);height:clamp(26px,7.5vw,30px);padding:0;border-radius:999px;
    background:#fff;color:#9aa7b8;border:1px solid var(--line);font-size:17px;font-weight:700;
    line-height:1;cursor:pointer;transition:.15s}
  .history__del:hover{background:var(--red);border-color:var(--red);color:#fff;transform:translateY(-1px)}
  .history__empty{color:#9aa7b8;font-size:clamp(13px,3.5vw,14px);padding:18px 4px;text-align:center}
  /* ---------- responsive: 手機自動調整尺寸 ---------- */
  @media (max-width:560px){
    .brand{gap:8px}
    .filters{margin-bottom:14px}
    .history__list li{gap:8px}
    .history__cat{display:none}
  }
  @media (max-width:380px){
    .card{padding:18px 12px}
    .controls{gap:8px}
    .chip{padding:7px 12px}
    .history__no{flex:0 0 22px}
    .history__list li{gap:6px}
  }
</style>
</head>

    '<li><span class="history__no">#'+(i+1)+'</span>'+
    '<span class="history__grp grp-'+h.g+'">'+(h.g==='A'?'Group A':'Group B')+'</span>'+
    '<span class="history__code">'+esc(h.p.ticker)+'</span>'+
    '<span class="history__name">'+esc(h.p.fund)+'</span>'+
    '<span class="history__cat">'+(h.p.cat==='LI'?'L&amp;I':'ETF')+'</span>'+
    '<button class="history__del" data-idx="'+i+'" type="button"'+
      ' title="Delete this record and return it to the pool" aria-label="Delete record">&times;</button></li>'
  ).join('');
  list.querySelectorAll('.history__del').forEach(btn=>{
    btn.onclick=()=>removeHistory(+btn.dataset.idx);
  });
  if(scrollBottom) list.scrollTop=list.scrollHeight;   // 只在新增時自動捲到最新一筆
}
function addHistory(p){ history.push({p, g:currentGroup}); renderHistory(true); }

/* 刪除單筆記錄：把該產品放回抽題池，之後可重新抽到 */
function removeHistory(i){
  if(i<0||i>=history.length) return;
  const rec=history.splice(i,1)[0];
  pool.push(rec.p);                                 // 放回未抽出的池
  drawnCount=Math.max(0,drawnCount-1);
  if(currentPick && currentPick.ticker===rec.p.ticker){   // 刪掉的正是目前顯示的結果 → 清空結果卡
    currentPick=null;
    $('viewResult').style.display='none';
    $('viewRolling').style.display='none';
    $('viewPlaceholder').style.display='block';
  }
  renderHistory();
  updateStats();
  if(pool.length>0){                                // 池子有東西了 → 解除 Done 狀態
    $('drawBtn').disabled=false;
    if($('drawBtn').textContent==='Done') $('drawBtn').textContent='Start';
    $('done').style.display='none';
  }
}

const ROLL_MS=75;                 // 滾動時每幀切換間隔（毫秒）
let fieldRows=6;                  // 代碼矩陣列數（依視窗寬度自動調整）
let timer=null, rolling=false;
let cells=[], litIdx=-1, curCode='';
const randFrom = a => a[Math.floor(Math.random()*a.length)];

/* 滿屏代碼矩陣：依視窗寬度決定欄數，鋪滿整張卡片 */
function buildField(){
  const field=$('codefield');
  const w=window.innerWidth;
  const cols = w<=380 ? 4 : (w<=560 ? 5 : (w<=760 ? 6 : 8));   // 手機 4-5 欄、平板 6 欄、桌面 8 欄
  fieldRows = w<=380 ? 5 : 6;                                   // 極窄手機減少列數
  const n=cols*fieldRows;
  field.style.setProperty('--cols', cols);
  field.innerHTML='';
  cells=[];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    d.className='cell';
    d.textContent=randFrom(pool).ticker;
    field.appendChild(d);
    cells.push(d);
  }
  litIdx=-1; curCode='';
}

/* 每一幀：隨機刷新大量格子（閃動感）＋ 隨機跳到某一格高亮（該格的代碼就是抽獎結果） */
function tickField(){
  if(!cells.length){ return; }
  for(const c of cells){ if(Math.random()<0.6) c.textContent=randFrom(pool).ticker; }
  if(litIdx>=0 && cells[litIdx]) cells[litIdx].classList.remove('lit');
  litIdx=Math.floor(Math.random()*cells.length);
  const cell=cells[litIdx];
  curCode=cell.textContent=randFrom(pool).ticker;
  cell.classList.add('lit');
}

/* 視窗尺寸改變（旋轉手機 / 縮放）時重建矩陣，確保版面自動符合新寬度 */
window.addEventListener('resize',()=>{ if(rolling){ buildField(); tickField(); } });

function rebuild(){
  if(timer){clearInterval(timer);timer=null;}
  rolling=false;
  $('card').classList.remove('rolling');
  $('drawBtn').classList.remove('rolling-btn');
  pool=shuffle(listFor(cat));
  drawnCount=0;
  history=[]; renderHistory();
  currentPick=null;
  updateStats();
  $('viewResult').style.display='none';
  $('viewRolling').style.display='none';
  $('viewPlaceholder').style.display='block';
  $('done').style.display='none';
  $('drawBtn').disabled = pool.length===0;
  $('drawBtn').textContent = pool.length===0 ? 'Done' : 'Start';
}

function updateStats(){
  $('total').textContent=listFor(cat).length;
  $('drawn').textContent=drawnCount;
  $('remain').textContent=pool.length;
}

function startRoll(){
  if(pool.length===0){return;}
  rolling=true;
  $('viewPlaceholder').style.display='none';
  $('viewResult').style.display='none';
  $('viewRolling').style.display='block';
  $('card').classList.add('rolling');
  $('drawBtn').textContent='Pause';
  $('drawBtn').classList.add('rolling-btn');
  buildField();
  tickField();
  timer=setInterval(tickField, ROLL_MS);
}

function stopRoll(){
  if(!rolling){return;}
  rolling=false;
  clearInterval(timer); timer=null;
  $('card').classList.remove('rolling');
  $('drawBtn').classList.remove('rolling-btn');
  // 停在當前高亮格顯示的代碼（必定來自未抽出的 pool，保證不重複）
  const code=curCode;
  const idx=pool.findIndex(p=>p.ticker===code);
  const pick = idx>=0 ? pool.splice(idx,1)[0] : pool.pop();
  drawnCount++;
  $('viewRolling').style.display='none';
  $('viewResult').style.display='block';
  $('ticker').innerHTML=pick.ticker+'<small>HKEX 代碼</small>';
  $('fund').textContent=pick.fund;
  currentPick=pick;
  let tags='<span class="history__grp grp-'+currentGroup+'">'+(currentGroup==='A'?'Group A':'Group B')+'</span>';
  tags+='<span class="cat-tag">'+(pick.cat==='LI'?'Leveraged &amp; Inverse Product':'Exchange Traded Fund')+'</span>';
  if(pick.synthetic){tags+='<span class="cat-tag warn">Synthetic ETF</span>';}
  $('tags').innerHTML=tags;
  const card=$('viewResult');
  card.classList.remove('reveal'); void card.offsetWidth; card.classList.add('reveal');
  addHistory(pick);
  updateStats();
  if(pool.length===0){ $('drawBtn').disabled=true; $('drawBtn').textContent='Done'; $('done').style.display='block'; }
  else { $('drawBtn').textContent='Start'; }
}

$('drawBtn').onclick=()=>{ rolling ? stopRoll() : startRoll(); };
$('resetBtn').onclick=()=>rebuild();
$('histClear').onclick=()=>{
  if(!history.length) return;
  if(confirm('Clear all history records and return them to the pool?')){
    pool=pool.concat(history.map(r=>r.p));      // 全部放回抽題池
    drawnCount=Math.max(0,drawnCount-history.length);
    history=[];
    currentPick=null;
    $('viewResult').style.display='none';
    $('viewRolling').style.display='none';
    $('viewPlaceholder').style.display='block';
    renderHistory();
    updateStats();
    if(pool.length>0){                           // 池子恢復有東西 → 解除 Done
      $('drawBtn').disabled=false;
      if($('drawBtn').textContent==='Done') $('drawBtn').textContent='Start';
      $('done').style.display='none';
    }
  }
};

/* Group A / B 選擇器：決定下一次抽題歸屬哪個小組 */
document.querySelectorAll('#groupSel .gbtn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('#groupSel .gbtn').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    currentGroup=btn.dataset.g;
  };
});

document.querySelectorAll('.chip').forEach(ch=>{
  ch.onclick=()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    ch.classList.add('active');
    cat=ch.dataset.cat;
    rebuild();
  };
});

rebuild();
</script>
</body>
</html>
